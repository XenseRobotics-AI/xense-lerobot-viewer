name: Type Check & Lint

# No `paths:` filter on purpose: `type-check` is a required status check on main,
# and a filtered workflow never reports on PRs that miss the filter — those PRs
# would sit at "pending" forever. This job also runs `format:check`, which covers
# Markdown and config files that the old filter excluded.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check
