name: Tests

# No `paths:` filter on purpose: `test` is a required status check on main, and
# a filtered workflow never reports on PRs that miss the filter — those PRs would
# sit at "pending" forever. The suite runs in ~15s, so gating every PR is cheap.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests
        run: bun test

      - name: Browser playback regression
        run: bun run test:video-playback
