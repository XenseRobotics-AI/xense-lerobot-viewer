name: Tests

# No `paths:` filter on purpose: `test` is a required status check on main, and
# a filtered workflow never reports on PRs that miss the filter — those PRs would
# sit at "pending" forever. The suite runs in ~15s, so gating every PR is cheap.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # next dev/start uses node even when launched with bun. Keep the stream
      # subprocess regressions on the version that exposed the abort race.
      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Browser review recovery
        run: bun run test:review-save

      - name: Browser playback regression
        run: bun run test:video-playback

      - name: Python regression
        run: |
          if compgen -G "scripts/test_*.py" > /dev/null; then
            python3 -m unittest discover -s scripts -p 'test_*.py'
          fi
          if compgen -G "scripts/mail-smoke-test/test_*.py" > /dev/null; then
            python3 -m unittest discover -s scripts/mail-smoke-test -p 'test_*.py'
          fi

      - name: Build production
        run: bun run build

      - name: Production review fault checks
        run: bun run test:review-production
